name: Deploy to GitHub Pages

# main 에 푸시될 때마다 웹 앱을 빌드해 GitHub Pages 로 배포한다.
# CI 러너는 인터넷이 열려 있어 Higgsfield CDN 의 얼굴/영상/3D 메시를 받아
# 사이트에 같은-출처 파일로 구워 넣는다 (CORS·링크 만료 문제 제거).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install
        working-directory: web
        run: npm install
      - name: Vendor generated assets (face / idle / 3D mesh)
        working-directory: web
        run: npm run assets:fetch || echo "assets:fetch 일부 실패 — 런타임 폴백으로 계속"
      - name: Build
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
