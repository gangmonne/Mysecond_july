<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>세컨과의 식사 — LIVE</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #d8d2c8;
        --dim: #8c8072;
        --bg: #12100e;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
        min-height: 100vh;
      }
      #app { display: flex; flex-direction: column; min-height: 100vh; }
      #stage { position: relative; flex: 1; min-height: 60vh; background: #0a0908; }
      #envelope {
        height: 32vh; overflow-y: auto; padding: 12px 16px;
        border-top: 1px solid #2a251f;
        font-size: 12px; line-height: 1.7; color: var(--dim);
        font-family: ui-monospace, "SF Mono", monospace;
      }
      #envelope .t { color: #4d453b; margin-right: 8px; }
      #privacy {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        text-align: center; padding: 24px; background: var(--bg); z-index: 10;
      }
      #privacy p { max-width: 34em; color: var(--dim); font-size: 14px; line-height: 1.8; }
      #privacy strong { color: var(--ink); font-weight: 500; }
      #privacy button {
        margin-top: 8px; padding: 10px 28px; background: none; cursor: pointer;
        border: 1px solid #3a332b; color: var(--ink); font-size: 14px; letter-spacing: 0.2em;
      }
      #privacy button:hover { border-color: var(--dim); }
      #caption {
        position: absolute; left: 0; right: 0; bottom: 9vh; z-index: 6;
        text-align: center; padding: 0 10vw; pointer-events: none;
        font-size: clamp(16px, 2.2vw, 24px); line-height: 1.7; color: var(--ink);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      }
      #clock {
        position: absolute; right: 14px; top: 12px; z-index: 5; pointer-events: none;
        font-family: ui-monospace, monospace; font-size: 11px; color: #4d453b;
        letter-spacing: 0.12em;
      }
      /* fidelity 열화 — 재생속도/불투명도는 렌더러가, 질감 파손은 여기서 */
      .second-body[data-glitch="soft"] video {
        filter: saturate(0.92) contrast(0.98);
      }
      .second-body[data-glitch="strong"] video {
        filter: saturate(0.78) contrast(1.06) hue-rotate(calc(var(--tb, 0) * 10deg));
        animation: glitch-jitter 360ms steps(2) infinite;
      }
      @keyframes glitch-jitter {
        0%, 100% { transform: none; }
        50% { transform: translateX(calc((var(--tb, 0) + 0.4) * 2px)) scaleX(1.003); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="body" class="second-body" style="position: absolute; inset: 0"></div>
        <div id="caption"></div>
        <div id="clock"></div>
        <div id="privacy">
          <p><strong>세컨과의 식사 — LIVE</strong></p>
          <p>
            이 세션은 웹캠으로 당신의 몸짓을 읽습니다.<br />
            <strong>웹캠 프레임은 어떤 형태로도 저장·전송되지 않습니다.</strong><br />
            찡그림, 웃음, 손 뻗기 같은 신호(SignalEvent)만 남습니다.
          </p>
          <button id="begin">앉기</button>
        </div>
      </div>
      <div id="envelope" aria-label="행동 봉투"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
