<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>세컨과의 식사 — LIVE</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e4ddd0;
        --dim: #8c8072;
        --faint: #4d453b;
        --bg: #0a0807;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #000;
        color: var(--ink);
        font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
        overflow: hidden;
      }
      #app { position: relative; height: 100vh; }
      #stage {
        position: absolute; inset: 0; background: var(--bg);
        overflow: hidden; cursor: none;
      }
      #body { position: absolute; inset: 0; z-index: 1; }

      /* ── 시네마틱 레이어 (cinematic.ts 가 생성) ───────────────────── */
      /* 어둠 속의 현존 — 클립이 없어도 화면이 비어 보이지 않게 하는 숨쉬는 오라 */
      .cine-aura {
        position: absolute; inset: -10%; z-index: 0; pointer-events: none;
        background:
          radial-gradient(42% 55% at 50% 46%, rgba(76, 66, 54, 0.55), rgba(28, 24, 20, 0.25) 46%, transparent 72%),
          radial-gradient(80% 80% at 50% 60%, rgba(12, 10, 9, 0.2), #000 85%);
        transform: scale(1);
        animation: breathe 7.5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.035); opacity: 1; }
      }
      #stage[data-mood="talk"] .cine-aura { animation-duration: 3.6s; }
      #stage[data-mood="gesture"] .cine-aura { animation-duration: 2.2s; }

      /* 컬러 그레이드 — 그림자를 따뜻하게 눌러 필름 톤으로 */
      .cine-grade {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        mix-blend-mode: soft-light;
        background: linear-gradient(180deg, rgba(60, 42, 28, 0.35), rgba(10, 14, 22, 0.4));
      }
      /* 비네트 */
      .cine-vignette {
        position: absolute; inset: 0; z-index: 3; pointer-events: none;
        background: radial-gradient(72% 72% at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.72) 100%);
      }
      /* 필름 그레인 (canvas) */
      .cine-grain {
        position: absolute; inset: 0; z-index: 4; pointer-events: none;
        width: 100%; height: 100%;
        image-rendering: pixelated; mix-blend-mode: overlay; opacity: 0.06;
      }
      /* 레터박스 — 세션 시작에 천천히 닫힌다 */
      .cine-bar {
        position: absolute; left: 0; right: 0; height: 0; z-index: 7;
        background: #000; pointer-events: none;
        transition: height 1600ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .cine-bar.top { top: 0; }
      .cine-bar.bottom { bottom: 0; }
      #stage[data-cine="on"] .cine-bar { height: 8.5vh; }

      /* fidelity 열화 — 재생속도/불투명도는 렌더러가, 질감 파손은 여기서 */
      .second-body[data-glitch="soft"] video { filter: saturate(0.9) contrast(0.98); }
      .second-body[data-glitch="strong"] video {
        filter: saturate(0.74) contrast(1.07) hue-rotate(calc(var(--tb, 0) * 10deg));
        animation: glitch-jitter 360ms steps(2) infinite;
      }
      @keyframes glitch-jitter {
        0%, 100% { transform: none; }
        50% { transform: translateX(calc((var(--tb, 0) + 0.4) * 2px)) scaleX(1.003); }
      }

      /* ── 자막 — 허공에 떠도는 휘발되는 언어 (words.ts 가 토큰을 흩뿌린다) ── */
      #caption {
        position: absolute; inset: 0; z-index: 6; pointer-events: none;
        font-size: clamp(17px, 2.15vw, 27px); font-weight: 300;
        letter-spacing: 0.02em; color: var(--ink);
      }
      #caption .float-word {
        text-shadow: 0 1px 24px rgba(0, 0, 0, 0.95), 0 0 3px rgba(0, 0, 0, 0.9);
      }

      #clock {
        position: absolute; right: 18px; top: 16px; z-index: 6; pointer-events: none;
        font-family: ui-monospace, monospace; font-size: 10px; color: var(--faint);
        letter-spacing: 0.22em; opacity: 0.6;
      }

      /* ── 콜드 오픈 (privacy / 인트로) ────────────────────────── */
      #privacy {
        position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        text-align: center; padding: 24px; background: #000;
      }
      #privacy .title {
        font-size: clamp(22px, 3vw, 34px); font-weight: 300; letter-spacing: 0.34em;
        color: var(--ink); text-indent: 0.34em;
      }
      #privacy p { max-width: 32em; color: var(--dim); font-size: 13.5px; line-height: 2; font-weight: 300; }
      #privacy strong { color: var(--ink); font-weight: 400; }
      #privacy button {
        margin-top: 10px; padding: 12px 40px; background: rgba(0, 0, 0, 0.2); cursor: pointer;
        border: 1px solid #3a332b; color: var(--ink); font-size: 13px; letter-spacing: 0.4em;
        text-indent: 0.4em; transition: border-color 400ms ease, background 400ms ease;
      }
      #privacy button:hover { border-color: var(--dim); background: rgba(140, 128, 114, 0.06); }
      #privacy.fade { opacity: 0; pointer-events: none; transition: opacity 1400ms ease; }

      /* ── 운영자 모니터 (기본 숨김, [m] 토글) — 오디언스에겐 안 보인다 ── */
      #envelope {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; display: none;
        max-height: 34vh; overflow-y: auto; padding: 10px 16px 14px;
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.82) 30%);
        font-size: 11px; line-height: 1.65; color: var(--dim);
        font-family: ui-monospace, "SF Mono", monospace;
      }
      #envelope .t { color: var(--faint); margin-right: 8px; }
      body.monitor #envelope { display: block; }
      body.monitor #stage { cursor: default; }

      /* 시작 화면의 보조 버튼 — 앉기 아래, 더 조용하게 */
      #privacy .ghost {
        margin-top: 2px; padding: 8px 20px; font-size: 11px; letter-spacing: 0.24em;
        text-indent: 0.24em; border-color: #241f1a; color: var(--dim);
      }

      /* ── 운영자 컨트롤 바 — 영상 플레이어처럼: 마우스 움직이면 뜨고 가만있으면 사라진다.
            관객 세션 중엔 마우스가 안 움직이므로 보이지 않는다. ── */
      #controls {
        position: absolute; left: 50%; bottom: 3.5vh; transform: translateX(-50%) translateY(6px);
        z-index: 14; display: flex; gap: 8px; padding: 6px;
        background: rgba(6, 5, 4, 0.82); border: 1px solid #241f1a; border-radius: 999px;
        backdrop-filter: blur(4px); opacity: 0; pointer-events: none;
        transition: opacity 420ms ease, transform 420ms ease;
      }
      #controls.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
      #controls button {
        background: none; border: 1px solid transparent; border-radius: 999px; cursor: pointer;
        color: var(--ink); font-size: 12px; letter-spacing: 0.14em; padding: 7px 16px;
        font-family: inherit; transition: border-color 240ms ease, background 240ms ease;
      }
      #controls button:hover { border-color: #3a332b; background: rgba(140, 128, 114, 0.08); }
      #controls button.active { border-color: var(--dim); color: #fff; }

      /* 세션 시작 직후 한 번 뜨는 안내 토스트 */
      #hint {
        position: absolute; left: 50%; bottom: 10vh; transform: translateX(-50%);
        z-index: 15; padding: 9px 18px; border-radius: 999px; pointer-events: none;
        background: rgba(6, 5, 4, 0.86); border: 1px solid #241f1a; color: var(--dim);
        font-size: 12px; letter-spacing: 0.06em; opacity: 0; transition: opacity 600ms ease;
      }
      #hint.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="body" class="second-body"></div>
        <div id="caption"></div>
        <div id="clock"></div>
        <div id="privacy">
          <div class="title">세컨과의 식사</div>
          <p>
            이 세션은 웹캠으로 당신의 몸짓을 읽습니다.<br />
            <strong>웹캠 프레임과 음성은 어떤 형태로도 저장·전송되지 않습니다.</strong><br />
            찡그림, 웃음, 손 뻗기 같은 신호만 남습니다.
          </p>
          <button id="begin">앉기</button>
          <button id="peekMonitor" class="ghost">감독 모니터 열기</button>
        </div>
        <div id="controls">
          <button id="ctlMonitor">◉ 감독 모니터</button>
          <button id="ctlTuning">이음새 조정</button>
        </div>
        <div id="hint"></div>
      </div>
      <div id="envelope" aria-label="행동 봉투"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
